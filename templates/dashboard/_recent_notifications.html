<div class="card"><h2>Notifikasi Terbaru</h2><div class="dashboard-notifications">{% for item in notifikasi_terbaru %}<article class="dashboard-notification"><strong>{{ item.judul }}</strong><div>{{ item.pesan }}</div><time>{{ item.created_at|date:'d M Y, H:i' }}{% if not item.status_baca %} · Belum dibaca{% endif %}</time></article>{% empty %}<p class="muted">Belum ada notifikasi.</p>{% endfor %}</div>{% if notifikasi_terbaru %}<a class="button secondary" href="{% url 'notifikasi_list' %}">Lihat semua notifikasi</a>{% endif %}</div>
